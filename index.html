<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fateh Luxe – Team Portal</title><link rel="icon" href="logo.jpeg"><meta name="theme-color" content="#6B0F1A">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDF5DC;--card:#FFFBEC;--ink:#3a0a10;--wine:#6B0F1A;--wine2:#8f1d2b;--gold:#B8892B;--mut:#8a6d6d;--line:#ead9b0;--ok:#2f7d4f;--bad:#b3261e;--r:18px}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#fff8e0,var(--bg) 60%)}
.lbox{width:100%;max-width:380px;text-align:center}
.stage{perspective:700px;height:150px;display:grid;place-items:center}
.gem{position:relative;width:90px;height:125px;transform-style:preserve-3d;animation:spin 9s linear infinite}
.gem i{position:absolute;left:0;width:90px;backface-visibility:visible;border:0}
.gem .u{top:-17px;height:67px;transform-origin:50% 100%;clip-path:polygon(50% 0,0 100%,100% 100%)}
.gem .d{top:50px;height:75px;transform-origin:50% 0;clip-path:polygon(0 0,100% 0,50% 100%)}
.gem i:nth-child(4n+1){background:#6B0F1A}.gem i:nth-child(4n+2){background:#8f1d2b}.gem i:nth-child(4n+3){background:#a52a3a}.gem i:nth-child(4n){background:#52070f}
.gem .u:nth-child(1),.gem .d:nth-child(5){--k:0}
@keyframes spin{to{transform:rotateX(-12deg) rotateY(360deg)}}
.gem{transform:rotateX(-12deg)}
.lbox h1{font-size:44px;letter-spacing:.14em;color:var(--wine);margin-top:6px}
.lbox p{letter-spacing:.35em;font-size:11px;color:var(--gold);text-transform:uppercase;margin:2px 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:left;box-shadow:0 20px 40px -24px rgba(107,15,26,.35)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--wine);box-shadow:0 0 0 3px rgba(107,15,26,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border:0;border-radius:12px;background:var(--wine);color:#fff8e7;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--wine2)}.btn:active{transform:scale(.97)}
.btn.w{width:100%;margin-top:16px}.btn.sm{padding:7px 11px;font-size:13px}.btn.ghost{background:transparent;color:var(--wine);border:1px solid var(--line)}.btn.ghost:hover{background:#fff}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
/* shell */
#app{min-height:100%;display:grid;grid-template-columns:1fr}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(253,245,220,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header img{width:40px;height:40px;border-radius:10px}header b{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--wine);letter-spacing:.08em}
header .sp{flex:1}header small{color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--wine);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:#e9cfa0;padding:6px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;cursor:pointer}
nav button span{font-size:19px;line-height:1}nav button.on{background:rgba(255,255,255,.14);color:#fff}
main{padding:16px 16px 100px;max-width:1100px;width:100%;margin:0 auto}
h2{font-size:30px;color:var(--wine);margin:4px 0 12px}h3{font-size:20px;color:var(--wine);margin-bottom:8px}
.grid{display:grid;gap:12px}.k{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .12s ease-out;transform-style:preserve-3d}
.kpi small{color:var(--mut);font-size:12px}.kpi b{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.1;margin-top:4px}
.kpi.hero{background:linear-gradient(135deg,#6B0F1A,#8f1d2b);color:#fff3d6;border:0}.kpi.hero small{color:#e9cfa0}
.up{color:var(--ok)}.dn{color:var(--bad)}.hero .up{color:#9be3b5}.hero .dn{color:#ffb4ab}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .g{flex:1;min-width:0}.row .g b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .g small{color:var(--mut)}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;background:#f3e6bd;color:var(--wine);font-weight:600}.pill.low{background:#fde0dd;color:var(--bad)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.f2 .full{grid-column:1/-1}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hb{margin:8px 0}.hb div{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--wine),var(--gold));margin-top:4px;transition:width .6s}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50}
@media(min-width:700px){.k{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.toast{bottom:30px}}
@media(min-width:900px){#app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}header.top{grid-column:1/-1}
nav{position:sticky;top:61px;height:calc(100vh - 61px);flex-direction:column;justify-content:flex-start;gap:4px;padding:14px 10px;grid-row:2}
nav button{flex:none;flex-direction:row;gap:10px;font-size:14px;padding:12px;justify-content:flex-start}main{padding-bottom:40px}}
@media(prefers-reduced-motion:reduce){.gem{animation:none}*{transition:none!important}}
</style></head><body>

<section id="login"><div class="lbox">
 <div class="stage"><div class="gem" id="gem"></div></div>
 <h1>FATEH.LUXE</h1><p>Timeless Elegance</p>
 <form class="panel" id="lf" autocomplete="on">
  <h3 id="lt">Team sign in</h3>
  <label for="u">Username</label><input id="u" autocomplete="username" required>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required minlength="4">
  <div class="err" id="le"></div>
  <button class="btn w" id="lb">Sign in</button>
 </form></div></section>

<div id="app" class="hide">
 <header class="top"><img src="logo.jpeg" alt="Fateh Luxe"><b>FATEH.LUXE</b><span class="sp"></span><small id="who"></small><button class="btn sm ghost" onclick="logout()">Log out</button></header>
 <nav id="nav"></nav><main id="main"></main>
</div>

<script>
const $=s=>document.querySelector(s),L=k=>JSON.parse(localStorage.getItem(k)||'null'),S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const inr=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN'),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fl:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let D=L('fl_data')||{items:[],orders:[],exp:[]},U=L('fl_users')||[],me=null,page='dash';
const save=()=>S('fl_data',D);
const CATS=['Stock purchase','Packaging','Marketing','Rent','Salary','Shipping','Other'];
const TABS=[['dash','◈','Home'],['inv','▣','Stock'],['ord','✦','Orders'],['exp','₹','Expenses'],['team','☺','Team']];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}

/* 3D gem */
(function(){let h='';for(let k=0;k<4;k++)h+=`<i class="u" style="transform:rotateY(${k*90}deg) translateZ(45px) rotateX(42deg)"></i>`;
for(let k=0;k<4;k++)h+=`<i class="d" style="transform:rotateY(${k*90}deg) translateZ(45px) rotateX(-37deg)"></i>`;$('#gem').innerHTML=h})();

/* auth */
function loginMode(){const first=!U.length;$('#lt').textContent=first?'Create owner account':'Team sign in';$('#lb').textContent=first?'Create account':'Sign in';
 $('#p').autocomplete=first?'new-password':'current-password'}
$('#lf').onsubmit=async e=>{e.preventDefault();const u=$('#u').value.trim().toLowerCase(),h=await hash($('#p').value);
 if(!U.length){U=[{u,h,role:'owner'}];S('fl_users',U);start(U[0]);return}
 const f=U.find(x=>x.u===u&&x.h===h);if(!f){$('#le').textContent='Wrong username or password.';return}start(f)};
function start(usr){me=usr;sessionStorage.setItem('fl_sess',usr.u);$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=usr.u;$('#p').value='';$('#le').textContent='';
 $('#nav').innerHTML=TABS.map(t=>`<button data-p="${t[0]}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');go('dash')}
function logout(){sessionStorage.removeItem('fl_sess');me=null;$('#app').classList.add('hide');$('#login').classList.remove('hide');loginMode()}
function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 $('#main').innerHTML=({dash,inv,ord,exp,team})[p]();scrollTo(0,0)}
const re=()=>go(page);

/* calc */
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function months(n){const r=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1);r.push({k:m.toISOString().slice(0,7).replace(/(\d+)-(\d+)/,(a,y,mo)=>y+'-'+mo),l:m.toLocaleString('en',{month:'short'})})}return r}
function mk(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}

/* dashboard */
function dash(){
 const rev=sum(D.orders,o=>o.qty*o.price),cogs=sum(D.orders,o=>o.qty*o.cost),spend=sum(D.exp,e=>e.amt),net=rev-cogs-spend,
 stock=sum(D.items,i=>i.qty*i.cost),cust=new Set(D.orders.map(o=>o.cust.toLowerCase())).size;
 const ms=months(6).map(m=>({...m,r:sum(D.orders.filter(o=>mk(o.date)===m.k),o=>o.qty*o.price),e:sum(D.exp.filter(x=>mk(x.date)===m.k),x=>x.amt)}));
 const a=ms[5].r,b=ms[4].r,g=b?((a-b)/b*100):(a?100:0);
 const mx=Math.max(1,...ms.flatMap(m=>[m.r,m.e]));
 const bars=ms.map((m,i)=>{const x=14+i*57,h1=m.r/mx*130,h2=m.e/mx*130;return `<rect x="${x}" y="${150-h1}" width="20" height="${h1}" rx="4" fill="#6B0F1A"/><rect x="${x+23}" y="${150-h2}" width="20" height="${h2}" rx="4" fill="#B8892B"/><text x="${x+21}" y="168" font-size="11" text-anchor="middle" fill="#8a6d6d">${m.l}</text>`}).join('');
 const cats={};D.exp.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amt);const ce=Object.entries(cats).sort((x,y)=>y[1]-x[1]),col=['#6B0F1A','#B8892B','#a52a3a','#d9b66a','#8f5a5a','#52070f','#c9a0a0'],C=2*Math.PI*42;let acc=0;
 const donut=ce.length?`<svg viewBox="0 0 120 120" width="130" height="130">${ce.map((c,i)=>{const l=c[1]/spend*C,s=`<circle cx="60" cy="60" r="42" fill="none" stroke="${col[i%7]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;acc+=l;return s}).join('')}<text x="60" y="64" text-anchor="middle" font-size="11" fill="#6B0F1A" font-weight="600">${inr(spend)}</text></svg>`:'';
 const tp={};D.orders.forEach(o=>tp[o.iname]=(tp[o.iname]||0)+o.qty*o.price);const top=Object.entries(tp).sort((x,y)=>y[1]-x[1]).slice(0,5),tm=top[0]?top[0][1]:1;
 return `<h2>Dashboard</h2><div class="grid k">
 <div class="card kpi hero tilt"><small>Net profit</small><b>${inr(net)}</b><small class="${g>=0?'up':'dn'}">${g>=0?'▲':'▼'} ${Math.abs(g).toFixed(0)}% sales vs last month</small></div>
 <div class="card kpi tilt"><small>Total sales</small><b>${inr(rev)}</b><small>${D.orders.length} orders · ${cust} customers</small></div>
 <div class="card kpi tilt"><small>Total expenses</small><b>${inr(spend)}</b><small>${D.exp.length} entries</small></div>
 <div class="card kpi tilt"><small>Stock value</small><b>${inr(stock)}</b><small>${sum(D.items,i=>i.qty)} pieces in hand</small></div></div>
 <div class="grid two" style="margin-top:12px">
 <div class="card"><h3>Sales vs expenses</h3><svg viewBox="0 0 360 178" width="100%">${bars}</svg><div class="leg"><span><i style="background:#6B0F1A"></i>Sales</span><span><i style="background:#B8892B"></i>Expenses</span></div></div>
 <div class="card"><h3>Where money goes</h3>${ce.length?`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${donut}<div style="flex:1;min-width:130px;font-size:13px">${ce.map((c,i)=>`<div class="row" style="padding:5px 0"><i style="width:10px;height:10px;border-radius:3px;background:${col[i%7]}"></i><span class="g">${esc(c[0])}</span><b>${inr(c[1])}</b></div>`).join('')}</div></div>`:'<div class="empty">Add an expense to see the split.</div>'}</div>
 <div class="card"><h3>Best sellers</h3>${top.length?top.map(t=>`<div class="hb"><div style="display:flex;justify-content:space-between;background:none;height:auto;margin:0"><span>${esc(t[0])}</span><b>${inr(t[1])}</b></div><div style="width:${t[1]/tm*100}%"></div></div>`).join(''):'<div class="empty">Record an order to see top items.</div>'}</div>
 <div class="card"><h3>Backup</h3><p style="color:var(--mut);margin-bottom:10px;font-size:13px">Data lives in this browser. Download a backup regularly or to move data to another device.</p><button class="btn sm" onclick="dl()">Download backup</button> <label class="btn sm ghost" style="display:inline-flex;margin:0;color:var(--wine)">Restore<input type="file" accept=".json" class="hide" onchange="rs(this)"></label></div></div>`}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='fateh-luxe-backup-'+today()+'.json';a.click()}
function rs(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.items||!d.orders||!d.exp)throw 0;D=d;save();re();toast('Backup restored')}catch{toast('Not a valid backup file')}})}

/* inventory */
function inv(){return `<h2>Stock</h2><form class="card" onsubmit="addItem(event)"><h3>Add item</h3><div class="f2"><div class="full"><label>Item name</label><input name="n" required></div>
 <div><label>Quantity</label><input name="q" type="number" min="0" inputmode="numeric" required></div><div><label>Cost price (₹)</label><input name="c" type="number" min="0" step="any" inputmode="decimal" required></div>
 <div class="full"><label>Selling price (₹)</label><input name="p" type="number" min="0" step="any" inputmode="decimal" required></div></div><button class="btn w">Add item</button></form>
 <div class="card" style="margin-top:12px"><h3>All items (${D.items.length})</h3>${D.items.length?D.items.map(i=>`<div class="row"><div class="g"><b>${esc(i.name)}</b><small>Cost ${inr(i.cost)} · Sell ${inr(i.price)}</small></div><span class="pill ${i.qty<5?'low':''}">${i.qty} left</span><button class="btn sm ghost" onclick="restock('${i.id}')">+ Stock</button><button class="btn sm ghost" onclick="delItem('${i.id}')">✕</button></div>`).join(''):'<div class="empty">No items yet. Add your first piece above.</div>'}</div>`}
function addItem(e){e.preventDefault();const f=new FormData(e.target);D.items.push({id:uid(),name:f.get('n').trim(),qty:+f.get('q'),cost:+f.get('c'),price:+f.get('p')});save();re();toast('Item added')}
function restock(id){const n=+prompt('How many pieces to add?');if(!n)return;D.items.find(i=>i.id===id).qty+=n;save();re()}
function delItem(id){if(confirm('Delete this item? Past orders are kept.')){D.items=D.items.filter(i=>i.id!==id);save();re()}}

/* orders */
function ord(){const opts=D.items.map(i=>`<option value="${i.id}" data-p="${i.price}">${esc(i.name)} (${i.qty} left)</option>`).join('');
 return `<h2>Orders</h2>${D.items.length?`<form class="card" onsubmit="addOrd(event)"><h3>New order</h3><div class="f2"><div class="full"><label>Customer</label><input name="c" required></div>
 <div class="full"><label>Item</label><select name="i" onchange="this.form.p.value=this.selectedOptions[0].dataset.p">${opts}</select></div>
 <div><label>Quantity</label><input name="q" type="number" min="1" value="1" inputmode="numeric" required></div><div><label>Price each (₹)</label><input name="p" type="number" min="0" step="any" value="${D.items[0].price}" required></div>
 <div class="full"><label>Date</label><input name="d" type="date" value="${today()}" required></div></div><button class="btn w">Save order</button></form>`:'<div class="card empty">Add items in Stock first, then record orders here.</div>'}
 <div class="card" style="margin-top:12px"><h3>Recent orders</h3>${D.orders.length?[...D.orders].reverse().slice(0,50).map(o=>`<div class="row"><div class="g"><b>${esc(o.cust)}</b><small>${esc(o.iname)} × ${o.qty} · ${o.date}</small></div><div style="text-align:right"><b>${inr(o.qty*o.price)}</b><small class="up" style="display:block">+${inr(o.qty*(o.price-o.cost))}</small></div><button class="btn sm ghost" onclick="delOrd('${o.id}')">✕</button></div>`).join(''):'<div class="empty">No orders yet.</div>'}</div>`}
function addOrd(e){e.preventDefault();const f=new FormData(e.target),it=D.items.find(i=>i.id===f.get('i')),q=+f.get('q');
 if(q>it.qty){toast('Only '+it.qty+' in stock');return}it.qty-=q;D.orders.push({id:uid(),date:f.get('d'),cust:f.get('c').trim(),itemId:it.id,iname:it.name,qty:q,price:+f.get('p'),cost:it.cost});save();re();toast('Order saved, stock updated')}
function delOrd(id){const o=D.orders.find(x=>x.id===id);if(!confirm('Delete this order and return items to stock?'))return;const it=D.items.find(i=>i.id===o.itemId);if(it)it.qty+=o.qty;D.orders=D.orders.filter(x=>x.id!==id);save();re()}

/* expenses */
function exp(){const t=sum(D.exp,e=>e.amt);return `<h2>Expenses</h2><form class="card" onsubmit="addExp(event)"><h3>Add expense</h3><div class="f2"><div><label>Amount (₹)</label><input name="a" type="number" min="0" step="any" inputmode="decimal" required></div>
 <div><label>Date</label><input name="d" type="date" value="${today()}" required></div><div class="full"><label>Category</label><select name="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
 <div class="full"><label>Note (optional)</label><input name="n"></div></div><button class="btn w">Save expense</button></form>
 <div class="card" style="margin-top:12px"><h3>History · ${inr(t)}</h3>${D.exp.length?[...D.exp].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(e=>`<div class="row"><div class="g"><b>${esc(e.cat)}</b><small>${e.date}${e.note?' · '+esc(e.note):''}</small></div><b>${inr(e.amt)}</b><button class="btn sm ghost" onclick="delExp('${e.id}')">✕</button></div>`).join(''):'<div class="empty">No expenses yet.</div>'}</div>`}
function addExp(e){e.preventDefault();const f=new FormData(e.target);D.exp.push({id:uid(),date:f.get('d'),cat:f.get('c'),amt:+f.get('a'),note:f.get('n').trim()});save();re();toast('Expense saved')}
function delExp(id){if(confirm('Delete this expense?')){D.exp=D.exp.filter(x=>x.id!==id);save();re()}}

/* team */
function team(){const own=me.role==='owner';return `<h2>Team</h2>${own?`<form class="card" onsubmit="addUser(event)"><h3>Add a team member</h3><div class="f2"><div><label>Username</label><input name="u" required></div><div><label>Password</label><input name="p" type="password" minlength="4" required></div></div><div class="err" id="te"></div><button class="btn w">Add member</button></form>`:''}
 <div class="card" style="margin-top:12px"><h3>Members (${U.length}/5)</h3>${U.map(x=>`<div class="row"><div class="g"><b>${esc(x.u)}</b><small>${x.role}</small></div>${own&&x.role!=='owner'?`<button class="btn sm ghost" onclick="delUser('${esc(x.u)}')">Remove</button>`:''}</div>`).join('')}</div>`}
async function addUser(e){e.preventDefault();const f=new FormData(e.target),u=f.get('u').trim().toLowerCase();
 if(U.length>=5){$('#te').textContent='Team is limited to 5 members.';return}if(U.some(x=>x.u===u)){$('#te').textContent='That username is taken.';return}
 U.push({u,h:await hash(f.get('p')),role:'member'});S('fl_users',U);re();toast('Member added')}
function delUser(u){if(confirm('Remove '+u+'?')){U=U.filter(x=>x.u!==u);S('fl_users',U);re()}}

/* 3D tilt on cards */
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.tilt');document.querySelectorAll('.tilt').forEach(t=>{if(t!==c)t.style.transform=''});
 if(!c||e.pointerType==='touch')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(600px) rotateY(${x*12}deg) rotateX(${-y*12}deg)`});
document.addEventListener('pointerleave',()=>document.querySelectorAll('.tilt').forEach(t=>t.style.transform=''));

/* boot */
loginMode();const s=sessionStorage.getItem('fl_sess'),su=U.find(x=>x.u===s);if(su)start(su);
</script></body></html>
